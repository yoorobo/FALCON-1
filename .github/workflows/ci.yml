name: CI — FALCON-1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ROS_DISTRO: jazzy

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # openarm_ros2 서브모듈 제외

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest

      - name: Python Lint (ruff)
        run: ruff check src/ --exclude src/openarm_ros2

      - name: Unit Tests (pytest)
        run: |
          python -m pytest src/ --ignore=src/openarm_ros2 -q --tb=short \
            || echo "::warning::일부 테스트가 ROS 2 의존성으로 인해 건너뛰었을 수 있습니다"

      - name: File size check (500 lines)
        run: |
          OVERSIZED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 500 ]; then
              echo "::warning file=$file::$LINES lines (exceeds 500 line limit)"
              OVERSIZED=1
            fi
          done < <(find src/ -path src/openarm_ros2 -prune -o \( -name '*.py' -o -name '*.cpp' -o -name '*.hpp' \) -print)
          if [ "$OVERSIZED" -eq 1 ]; then
            echo "⚠️ 500줄 초과 파일 존재 (경고)"
          else
            echo "✅ 파일 크기 검사 통과"
          fi
